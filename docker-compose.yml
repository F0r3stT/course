services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: flights
      POSTGRES_USER: flights_user
      POSTGRES_PASSWORD: password
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/00_roles.sql:/docker-entrypoint-initdb.d/00_roles.sql:ro
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./db/flights_dump.sql:/docker-entrypoint-initdb.d/02_flights_dump.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flights_user -d flights"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./flight_backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ./.env
    environment:
      DATABASE_URL: postgres://flights_user:password@db:5432/flights
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8080"

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: web
    restart: unless-stopped
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  db_data:
  caddy_data:
  caddy_config:
